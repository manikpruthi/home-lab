# Name, entry point, and compatibility date
name = "commandcode-usage-tracker"
main = "worker.js"
compatibility_date = "2026-10-01"

# Fires every minute; the Worker only syncs when its adaptive due time has passed
# (every 1-5 min depending on request rate), otherwise a run is one D1 read.
[triggers]
crons = ["* * * * *"]

# D1 database binding (create first, then paste the database_id)
#   wrangler d1 create cc-usage-db
#   wrangler d1 execute cc-usage-db --remote --file=./schema.sql
[[d1_databases]]
binding = "DB"
database_name = "cc-usage-db"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
